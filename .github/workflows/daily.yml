name: Daily Aviation Briefing

on:
  schedule:
    - cron: '7 22 * * *' # 한국시간 오전 7시 7분 (UTC 22:07, 정각을 피해 지연/스킵 방지)
  workflow_dispatch:

jobs:
  briefing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install feedparser anthropic requests
      - run: python aviation_telegram.py
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
